# Email de confirmación de solicitud de borrado de cuenta
account_deletion_request:
    title: 'Solicitud de borrado de cuenta recibida'
    greeting: 'Hola, {username}.'
    body: |
        Hemos recibido una solicitud para borrar tu cuenta permanentemente.
        Si has sido tú, no necesitas hacer nada más.
    ip: 'La solicitud se realizó el {date} a las {time} desde la dirección IP: {ip}.'
    deadline: 'Tu cuenta y todos tus datos serán eliminados definitivamente el {date} a las {time}. Antes de esa fecha puedes cancelar el proceso desde tu perfil.'
    not_you: 'Si no has sido tú quien ha solicitado el borrado, accede a tu cuenta inmediatamente y cancela el proceso. Si no puedes acceder, contacta con el soporte.'
    farewell: 'Si ya no deseas usar el foro, no es necesario que hagas nada más. Lamentamos verte partir.'

# Email de aviso de eliminación definitiva de cuenta
deletion_warning:
    title: 'Tu cuenta será eliminada en menos de 24 horas'
    greeting: 'Hola, {username}.'
    body: |
        Hemos detectado que tu cuenta está programada para ser eliminada definitivamente.
        Una vez eliminada, todos tus datos, hilos y mensajes serán borrados de forma permanente
        y no podrán recuperarse.
    date: 'La eliminación está programada para el {date} a las {time}.'
    recover: |
        Si deseas conservar tu cuenta, inicia sesión antes de esa fecha y cancela
        el proceso de eliminación desde los ajustes de tu perfil.
    farewell: 'Si ya no deseas usar el foro, no es necesario que hagas nada. Lamentamos verte partir.'

connect_with_us: 'Conecta con nosotros:'
contact_info: 'Info de contacto:'
footer.note: |
    Estás recibiendo este mensaje porque tienes una cuenta en "{app_title}"

# Títulos para los correos
title:
    reset_password: Restablecimiento de contraseña
    verify_email: Verificar correo electrónico

# Email para confirmar el correo electrónico
verify_email:
    subject: Por favor confirma tu correo
    title: 'Hola, Por favor confirma tu correo'
    click: 'Por favor confirma tu dirección de correo electrónico haciendo clic en el siguiente enlace.'
    button: Confirmar mi correo
    note: 'Este enlace expirará en {expiration}, es necesario iniciar sesión para poder verificar el correo.'

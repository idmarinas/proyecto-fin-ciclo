name: pfc

services:
  ###> doctrine/doctrine-bundle ###
  database:
    image: mysql:${DATABASE_VERSION_NUMBER}
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_password
    healthcheck:
      test: mysqladmin ping
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - database_data:/var/lib/mysql
    secrets:
      - db_password
  ###< doctrine/doctrine-bundle ###

  webserver:
    image: idmarinas/pfc:${APP_VERSION}
    environment:
      SERVER_NAME: ${APP_SERVER_NAME}
      CLOUDFLARE_API_TOKEN_FILE: /run/secrets/cloudflare_api_token
    volumes:
      # Named volumes for /data and /config to persist important information.
      - caddy_data:/data
      - caddy_config:/config
    secrets:
      - cloudflare_api_token
    tty: true
    depends_on:
      - database
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      # Admin web
      - "traefik.tcp.routers.pfc.rule=HostSNI(`pfc.${APP_SERVER_NAME}`)"
      - "traefik.tcp.routers.pfc.service=pfc"
      - "traefik.tcp.routers.pfc.entrypoints=web,websecure"
      - "traefik.tcp.services.pfc.loadbalancer.server.port=443"
      - "traefik.tcp.routers.pfc.tls=true"
      - "traefik.tcp.routers.pfc.tls.passthrough=true"
      - "traefik.tcp.routers.pfc.priority=2"

volumes:
  caddy_data:
  caddy_config:
  ###> doctrine/doctrine-bundle ###
  database_data:
  ###< doctrine/doctrine-bundle ###

secrets:
  db_password:
    environment: DATABASE_PASSWORD
  cloudflare_api_token:
    environment: CLOUDFLARE_API_TOKEN

networks:
  proxy:
    external: true

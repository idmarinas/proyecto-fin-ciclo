# Full configuration reference: https://symfony.com/bundles/ux-icons/current/index.html#configuration
ux_icons:

    # Default HTML attributes to add to all icons
    default_icon_attributes:

        # Use current text color to fill the icon
        fill: currentColor

        # Default dimensions
        height: '1em'
        width: '1em'

    # Throw an exception if an icon is not
    ignore_not_found: false
    aliases:
        'alert:error': 'tabler:square-x'
        'alert:danger': 'tabler:circle-x'
        'alert:destructive': 'tabler:circle-x-filled'
        'alert:success': 'tabler:check'
        'alert:warning': 'tabler:exclamation-mark'
        'alert:info': 'tabler:info-circle'
        'alert:notice': 'tabler:message'
        'alert:default': 'tabler:message-circle'
        'toast:error': 'tabler:square-x'
        'toast:danger': 'tabler:circle-x'
        'toast:destructive': 'tabler:circle-x-filled'
        'toast:success': 'tabler:check'
        'toast:warning': 'tabler:exclamation-mark'
        'toast:info': 'tabler:info-circle'
        'toast:notice': 'tabler:message'
        'toast:default': 'tabler:message-circle'
        'close': 'tabler:x'
        'thread:open': 'tabler:message-circle'
        'thread:progress': 'tabler:message'
        'thread:in_review': 'tabler:database-search'
        'thread:waiting_customer': 'tabler:user-question'
        'thread:waiting_support': 'tabler:user-check'
        'thread:resolved': 'tabler:circle-check'
        'thread:closed': 'tabler:lock'


when@prod:
    ux_icons:
        # Suppress exceptions for missing icons in production
        ignore_not_found: true
